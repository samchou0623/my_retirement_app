name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter (Latest Custom Version)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # 🌟 強迫雲端下載最新最穩定的版本，徹底解決 3.7.0 舊版本衝突 Bug
          
      - name: Unzip Real App Source
        run: |
          unzip -o app_source.zip -d .
          ls -la
          
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
