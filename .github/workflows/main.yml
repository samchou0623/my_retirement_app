name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
      - name: Unzip and Locate Project
        run: |
          mkdir extracted_project
          unzip app01.zip -d extracted_project
          
          # 地毯式搜尋 pubspec.yaml 所在的真實路徑
          TARGET_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "真實專案路徑位於: $TARGET_DIR"
          
          # 將該路徑下的所有內容搬移到目前根目錄
          mv $TARGET_DIR/* .
          mv $TARGET_DIR/.* . 2>/dev/null || true
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
